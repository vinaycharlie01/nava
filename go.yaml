test:
  packages:
    - ./...
  args:
    - "-v"
    - "-short"
    - "-timeout=120s"

race:
  packages:
    - ./...
  args:
    - "-short"
    - "-timeout=120s"

coverage:
  packages:
    - ./...
  output: coverage.out
  args:
    - "-timeout=120s"

bench:
  packages:
    - ./...
  args:
    - "-timeout=120s"

vet:
  packages:
    - ./...

private:
  modules:
    - github.com/vinaycharlie01/k0s-cluster-shared
  repositories:
    # - bitbucket.org/myteam/private-repo
  rewrites:
    - insteadOf: https://github.com/
      with: ssh://git@github.com/
    # - insteadOf: https://bitbucket.org/
    #   with: git@bitbucket.org:
